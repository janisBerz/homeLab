---
- hosts: all
  become: true
  tasks:
    - name: Ensure destination directory exists
      file:
        path: /opt/stacks/torrentBox
        state: directory

    - name: Ensure torrentBox directory exists
      file:
        path: /mnt/media/torrentBox
        state: directory

    - name: Copy Docker Compose file
      copy:
        src: "{{ playbook_dir }}/../../docker/torrentBox/"
        dest: /opt/stacks/torrentBox/

    - name: Run Docker Compose
      command: docker compose up -d
      args:
        chdir: /opt/stacks/torrentBox