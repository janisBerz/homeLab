---
- hosts: all
  become: true
  tasks:
    - name: Ensure destination directory exists
      file:
        path: /opt/stacks/torrentBox
        state: directory

    - name: Copy Docker Compose file
      copy:
        src: "{{ playbook_dir }}/../../docker/torrentBox/docker-compose.yaml"
        dest: /opt/stacks/torrentBox/docker-compose.yaml

    - name: Run Docker Compose
      command: docker compose up -d
      args:
        chdir: /opt/stacks/torrentBox/docker-compose.yaml