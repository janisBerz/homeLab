---
- name: Audit current Kubernetes node configuration
  hosts: k8s_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Show hostname
      ansible.builtin.command: hostname
      changed_when: false

    - name: Show OS version
      ansible.builtin.command: cat /etc/os-release
      changed_when: false

    - name: Show node IPs
      ansible.builtin.command: hostname -I
      changed_when: false

    - name: Check swap
      ansible.builtin.command: swapon --show
      changed_when: false
      failed_when: false

    - name: Check loaded kernel modules
      ansible.builtin.shell: |
        lsmod | grep -E 'overlay|br_netfilter' || true
      changed_when: false

    - name: Check Kubernetes sysctl values
      ansible.builtin.shell: |
        sysctl net.bridge.bridge-nf-call-iptables
        sysctl net.bridge.bridge-nf-call-ip6tables
        sysctl net.ipv4.ip_forward
      changed_when: false

    - name: Check containerd status
      ansible.builtin.command: systemctl is-active containerd
      changed_when: false
      failed_when: false

    - name: Check kubelet status
      ansible.builtin.command: systemctl is-active kubelet
      changed_when: false
      failed_when: false

    - name: Check containerd cgroup setting
      ansible.builtin.command: grep SystemdCgroup /etc/containerd/config.toml
      changed_when: false
      failed_when: false

    - name: Check kubelet version
      ansible.builtin.command: kubelet --version
      changed_when: false
      failed_when: false

    - name: Check kubeadm version
      ansible.builtin.command: kubeadm version -o short
      changed_when: false
      failed_when: false

    - name: Check kubectl version
      ansible.builtin.command: kubectl version --client
      changed_when: false
      failed_when: false