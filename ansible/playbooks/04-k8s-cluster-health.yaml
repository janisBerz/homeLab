---
- name: Check Kubernetes cluster health
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check kubectl can reach the cluster
      ansible.builtin.command: kubectl get nodes -o wide
      changed_when: false

    - name: Check all pods across all namespaces
      ansible.builtin.command: kubectl get pods -A -o wide
      changed_when: false

    - name: Check Kubernetes services
      ansible.builtin.command: kubectl get svc -A
      changed_when: false

    - name: Check ingress resources
      ansible.builtin.command: kubectl get ingress -A
      changed_when: false
      failed_when: false

    - name: Check Cilium pods
      ansible.builtin.command: kubectl get pods -n kube-system -l k8s-app=cilium -o wide
      changed_when: false

    - name: Check MetalLB pods
      ansible.builtin.command: kubectl get pods -n metallb-system -o wide
      changed_when: false
      failed_when: false

    - name: Check NGINX Ingress pods
      ansible.builtin.command: kubectl get pods -n ingress-nginx -o wide
      changed_when: false
      failed_when: false