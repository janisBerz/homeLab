[k8s_control_plane]
k8s-node-01 ansible_host=192.168.1.10 node_ip=192.168.1.10
k8s-node-02 ansible_host=192.168.1.11 node_ip=192.168.1.11
k8s-node-03 ansible_host=192.168.1.12 node_ip=192.168.1.12

[dns_servers]
k8s-node-01

[k8s_nodes:children]
